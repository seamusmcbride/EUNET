# EUNET on your own machine: the portal plus a local AI model, nothing exposed to the internet.
#   docker compose up -d --build        then open http://localhost:8080
# First start downloads the AI model (about 2 GB for qwen2.5:3b), so give it a few minutes.
name: eunet

services:
  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # Only reachable from this computer
    environment:
      EUNET_ADMIN_PASSWORD: ${EUNET_ADMIN_PASSWORD:-change-me-please}
      TrustForwardedHeaders: "false"
      Ollama__Url: http://ollama:11434
      Ollama__Model: ${EUNET_AI_MODEL:-qwen2.5:3b}
    volumes:
      - portal-data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # NVIDIA GPU on Linux or Windows (WSL2): uncomment to make answers much faster
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Downloads the model once, then exits
  model-download:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${EUNET_AI_MODEL:-qwen2.5:3b}"]
    depends_on:
      - ollama
    restart: "no"

volumes:
  portal-data:
  ollama-models:

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gravity</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #ff5b2e; --ink: #16110f; --cream: #fff4e0; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--ink); font-family: "Bricolage Grotesque", system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .ui { position: fixed; z-index: 2; left: 0; right: 0; padding: 22px 4vw; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .ui.top { top: 0; } .ui.bottom { bottom: 0; }
    .ui > * { pointer-events: auto; }
    .brand { font-weight: 800; font-size: 22px; letter-spacing: -.02em; }
    .hint { font-size: 15px; font-weight: 500; opacity: .75; }
    .btns { display: flex; gap: 10px; flex-wrap: wrap; }
    button { font: 500 15px "Bricolage Grotesque"; border: 2px solid var(--ink); background: var(--cream); color: var(--ink); padding: 10px 18px; border-radius: 99px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
    button:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
    button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
    .count { font-weight: 800; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <canvas id="world"></canvas>
  <div class="ui top"><span class="brand">Gravity®</span><span class="hint">Grab, throw, stack. Click empty space to drop more.</span></div>
  <div class="ui bottom">
    <div class="btns">
      <button id="flip">Flip gravity</button>
      <button id="zero">Zero-G</button>
      <button id="party">Confetti burst</button>
      <button id="reset">Reset</button>
    </div>
    <span>Objects: <span class="count" id="count">0</span></span>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>

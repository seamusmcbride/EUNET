<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Outpost</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --fg: #e8f6ff; --cyan: #4fe3ff; --red: #ff4a3d; --muted: #8aa4b4; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; overflow: hidden; background: #05080c; color: var(--fg); font-family: Rajdhani, system-ui, sans-serif; user-select: none; touch-action: none; }
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hud { position: fixed; inset: 0; pointer-events: none; }
    .cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); }
    .cross::before, .cross::after { content: ""; position: absolute; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
    .cross::before { left: 10px; top: 0; width: 2px; height: 22px; } .cross::after { top: 10px; left: 0; height: 2px; width: 22px; }
    .cross.hit::before, .cross.hit::after { background: #fff; box-shadow: 0 0 10px #fff; }
    .gauges { position: absolute; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; width: min(300px, 60vw); }
    .gauge small { font-size: 13px; letter-spacing: .25em; color: var(--muted); display: flex; justify-content: space-between; }
    .gauge .track { height: 8px; background: #ffffff18; clip-path: polygon(0 0, 100% 0, 97% 100%, 0 100%); margin-top: 4px; }
    .gauge .fill { height: 100%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); transition: width .15s; }
    .gauge.hp .fill { background: #5dff9a; box-shadow: 0 0 12px #5dff9a; }
    .gauge.hp.low .fill { background: var(--red); box-shadow: 0 0 12px var(--red); }
    .top { position: absolute; top: calc(20px + env(safe-area-inset-top, 0px)); left: 0; right: 0; display: flex; justify-content: center; gap: 40px; text-align: center; }
    .top small { display: block; font-size: 12px; letter-spacing: .3em; color: var(--muted); }
    .top b { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 0 14px #4fe3ff88; }
    #banner { position: absolute; top: 30%; left: 0; right: 0; text-align: center; font-size: clamp(28px, 6vw, 56px); font-weight: 700; letter-spacing: .2em; color: var(--cyan); text-shadow: 0 0 24px var(--cyan); opacity: 0; transition: opacity .4s; }
    #dmg { position: absolute; inset: 0; background: radial-gradient(circle, transparent 50%, #ff2a1a 140%); opacity: 0; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; background: linear-gradient(180deg, #05080cdd, #05080cf5); }
    .overlay[hidden] { display: none; }
    .overlay h1 { font-size: clamp(64px, 14vw, 150px); letter-spacing: .12em; line-height: 1; background: linear-gradient(180deg, #fff, #4fe3ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 30px #4fe3ff66); }
    .overlay p { color: var(--muted); font-size: 19px; margin: 14px auto 28px; max-width: 560px; line-height: 1.5; }
    .overlay button { font: 700 20px Rajdhani; letter-spacing: .2em; color: #05080c; background: var(--cyan); border: 0; padding: 14px 44px; cursor: pointer; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); }
    .keys { font-size: 16px !important; }
    kbd { border: 1px solid #4fe3ff66; padding: 0 6px; border-radius: 3px; color: var(--fg); font-family: inherit; }
    .fire { display: none; }
    @media (pointer: coarse) {
      .fire { display: block; position: fixed; right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(120px + env(safe-area-inset-bottom, 0px)); width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--cyan); background: #4fe3ff33; color: var(--fg); font: 700 16px Rajdhani; pointer-events: auto; }
      .keys { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <div id="dmg"></div>
    <div class="top">
      <div><small>WAVE</small><b id="wave">1</b></div>
      <div><small>SCORE</small><b id="score">0</b></div>
      <div><small>HOSTILES</small><b id="left">0</b></div>
    </div>
    <div class="cross" id="cross"></div>
    <div id="banner"></div>
    <div class="gauges">
      <div class="gauge hp" id="hpGauge"><small><span>SHIELD</span><span id="hpText">100</span></small><div class="track"><div class="fill" id="hpFill" style="width:100%"></div></div></div>
      <div class="gauge"><small><span>ENERGY</span><span id="enText">100</span></small><div class="track"><div class="fill" id="enFill" style="width:100%"></div></div></div>
    </div>
    <button class="fire" id="fireBtn">FIRE</button>
  </div>
  <div class="overlay" id="start">
    <div>
      <h1>OUTPOST</h1>
      <p>Sundown on Kepler Station. Hunter drones are coming in waves. Hold the outpost as long as you can.</p>
      <p class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · mouse aim · <kbd>click</kbd> fire · <kbd>Shift</kbd> sprint · <kbd>Space</kbd> jump</p>
      <button id="play">DEPLOY</button>
    </div>
  </div>
  <div class="overlay" id="end" hidden>
    <div><h1 style="font-size:clamp(48px,10vw,110px)">SIGNAL LOST</h1><p id="endText"></p><button id="again">REDEPLOY</button></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>

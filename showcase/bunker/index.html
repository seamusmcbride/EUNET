<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Bunker</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0c0806; --fg: #f3e6d0; --red: #e0301e; --amber: #ffb000; --panel: #1b1310; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Chakra Petch", system-ui, sans-serif; user-select: none; touch-action: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { pointer-events: none; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 12px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, #000c); pointer-events: none; }
    .stat { background: var(--panel); border: 2px solid #3a2a20; border-radius: 6px; padding: 6px 16px; min-width: 110px; text-align: center; }
    .stat small { display: block; font-size: 11px; letter-spacing: .2em; color: #b09a80; }
    .stat b { font-size: 30px; font-variant-numeric: tabular-nums; color: var(--amber); }
    .stat.hp b { color: #ff5a3c; }
    #msg { position: fixed; top: 18%; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 22px; color: var(--amber); text-shadow: 0 2px 0 #000; opacity: 0; transition: opacity .3s; pointer-events: none; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; background: radial-gradient(circle, #2a0d08cc, #000e); }
    .overlay[hidden] { display: none; }
    .overlay h1 { font-size: clamp(56px, 12vw, 120px); letter-spacing: .06em; color: var(--red); text-shadow: 0 6px 0 #4a0d06, 0 0 40px #e0301e66; }
    .overlay p { color: #cdb89a; margin: 10px auto 26px; max-width: 520px; line-height: 1.6; }
    .overlay button { font: 700 20px "Chakra Petch"; background: var(--red); color: #fff; border: 0; border-radius: 6px; padding: 14px 40px; cursor: pointer; box-shadow: 0 5px 0 #6a1208; }
    .overlay button:active { transform: translateY(3px); box-shadow: 0 2px 0 #6a1208; }
    .keys { font-size: 14px; color: #a08c70; }
    kbd { background: #2a1d16; border: 1px solid #4a3528; border-radius: 4px; padding: 1px 7px; color: var(--fg); font-family: inherit; }
    .touch { display: none; }
    @media (pointer: coarse) {
      .touch { display: block; }
      .fire { position: fixed; right: calc(24px + env(safe-area-inset-right, 0px)); bottom: 110px; width: 86px; height: 86px; border-radius: 50%; border: 3px solid #fff6; background: #e0301e99; color: #fff; font: 700 16px "Chakra Petch"; }
      .stick { position: fixed; left: calc(30px + env(safe-area-inset-left, 0px)); bottom: 110px; width: 120px; height: 120px; border-radius: 50%; border: 2px solid #fff4; background: #ffffff10; pointer-events: none; }
      .keys { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div id="msg"></div>
  <div class="bar">
    <div class="stat hp"><small>HEALTH</small><b id="hp">100</b></div>
    <div class="stat"><small>SHELLS</small><b id="ammo">20</b></div>
    <div class="stat"><small>KILLS</small><b id="kills">0/0</b></div>
  </div>
  <div class="touch"><div class="stick"></div><button class="fire" id="fireBtn">FIRE</button></div>

  <div class="overlay" id="start">
    <div>
      <h1>BUNKER</h1>
      <p>Something got loose on level 3. Clear the bunker and reach the green exit pad.</p>
      <p class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · mouse to aim · <kbd>click</kbd> or <kbd>Space</kbd> to fire · <kbd>Shift</kbd> run</p>
      <button id="play">Enter the bunker</button>
    </div>
  </div>
  <div class="overlay" id="end" hidden>
    <div><h1 id="endTitle">YOU DIED</h1><p id="endText"></p><button id="again">Try again</button></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>

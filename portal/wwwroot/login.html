<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · EUNET</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="login">
    <form id="form" novalidate>
      <div class="brand" style="padding:0">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M4 16h24M16 2c5 5 5 23 0 28M16 2c-5 5-5 23 0 28" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        EUNET
      </div>
      <div><h1>Sign in</h1><p class="muted">Use the account your administrator gave you.</p></div>
      <label for="name">User name<input id="name" name="name" autocomplete="username" autocapitalize="none" required /></label>
      <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required /></label>
      <label class="check" for="remember"><input id="remember" type="checkbox" /> Keep me signed in on this device</label>
      <p class="error" id="error" role="alert"></p>
      <button class="primary" id="submit" type="submit">Sign in</button>
    </form>
  </div>
  <script src="/login.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · EUNET</title>
  <link rel="icon" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="lib/tabler/tabler.min.css" />
  <link rel="stylesheet" href="lib/tabler-icons/tabler-icons.min.css" />
  <link rel="stylesheet" href="portal.css" />
  <script src="theme.js"></script>
</head>
<body class="d-flex flex-column">
  <div class="row g-0 flex-fill min-vh-100">
    <div class="col-12 col-lg-6 col-xl-4 border-top-wide border-primary d-flex flex-column justify-content-center">
      <div class="container container-tight my-5 px-lg-5">
        <div class="text-center mb-4">
          <a href="." class="navbar-brand"><img src="logo.svg" width="44" height="44" alt="" /><span class="ms-2 fs-2 fw-bold">EUNET</span></a>
        </div>
        <h2 class="h3 text-center mb-3">Sign in to your account</h2>
        <form id="form" autocomplete="on" novalidate>
          <div class="mb-3">
            <label class="form-label" for="name">User name</label>
            <div class="input-icon">
              <span class="input-icon-addon"><i class="ti ti-user"></i></span>
              <input id="name" class="form-control" autocomplete="username" autocapitalize="none" placeholder="e.g. seamus" required />
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label" for="password">Password</label>
            <div class="input-group input-group-flat">
              <input id="password" type="password" class="form-control" autocomplete="current-password" required />
              <span class="input-group-text"><a href="#" class="link-secondary" id="reveal" title="Show password" aria-label="Show password"><i class="ti ti-eye"></i></a></span>
            </div>
          </div>
          <label class="form-check mb-3" for="remember"><input id="remember" type="checkbox" class="form-check-input" /><span class="form-check-label">Keep me signed in on this device</span></label>
          <div class="alert alert-danger d-none" id="error" role="alert"></div>
          <button class="btn btn-primary w-100" id="submit" type="submit"><i class="ti ti-login-2 me-2"></i>Sign in</button>
        </form>
        <div id="certOption" hidden>
          <div class="hr-text">or</div>
          <button class="btn w-100" id="certLogin" type="button"><i class="ti ti-certificate me-2"></i>Sign in with my certificate</button>
          <div class="small text-secondary text-center mt-2">Uses the EUNET certificate installed on this device.</div>
        </div>
        <div class="text-secondary text-center mt-4 small"><i class="ti ti-shield-lock me-1"></i>Sessions are encrypted and every sign-in is logged.</div>
      </div>
    </div>
    <div class="col-12 col-lg-6 col-xl-8 d-none d-lg-block login-art">
      <div class="login-art-copy">
        <div class="text-uppercase small fw-semibold opacity-75 mb-2">EUNET workspace</div>
        <div class="display-6 fw-bold mb-3">Files, cameras and tools for the whole team, on your own server.</div>
        <div class="d-flex gap-4 opacity-75"><span><i class="ti ti-folders me-1"></i>Documents</span><span><i class="ti ti-video me-1"></i>Cameras</span><span><i class="ti ti-photo-edit me-1"></i>Photo editor</span></div>
      </div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>

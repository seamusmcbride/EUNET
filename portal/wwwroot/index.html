<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EUNET</title>
  <link rel="icon" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="lib/tabler/tabler.min.css" />
  <link rel="stylesheet" href="lib/tabler-icons/tabler-icons.min.css" />
  <link rel="stylesheet" href="portal.css" />
  <script src="theme.js"></script>
</head>
<body>
  <div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-controls="sidebar-menu" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="navbar-brand navbar-brand-autodark">
          <a href="#home" class="d-flex align-items-center gap-2 text-reset text-decoration-none"><img src="logo.svg" width="32" height="32" alt="" /><span class="fw-bold fs-3">EUNET</span></a>
        </div>
        <div class="collapse navbar-collapse" id="sidebar-menu">
          <ul class="navbar-nav pt-lg-3" id="nav">
            <li class="nav-item"><a class="nav-link" href="#home"><span class="nav-link-icon"><i class="ti ti-layout-dashboard fs-2"></i></span><span class="nav-link-title">Dashboard</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#files"><span class="nav-link-icon"><i class="ti ti-folders fs-2"></i></span><span class="nav-link-title">Documents</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#cameras"><span class="nav-link-icon"><i class="ti ti-video fs-2"></i></span><span class="nav-link-title">Cameras</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#photos"><span class="nav-link-icon"><i class="ti ti-photo-edit fs-2"></i></span><span class="nav-link-title">Photo editor</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#games"><span class="nav-link-icon"><i class="ti ti-device-gamepad-2 fs-2"></i></span><span class="nav-link-title">Games</span></a></li>
            <li class="nav-item" id="adminNav" hidden><a class="nav-link" href="#admin"><span class="nav-link-icon"><i class="ti ti-users-group fs-2"></i></span><span class="nav-link-title">Users &amp; audit</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#account"><span class="nav-link-icon"><i class="ti ti-user-circle fs-2"></i></span><span class="nav-link-title">My account</span></a></li>
          </ul>
          <div class="mt-auto px-3 pb-3 d-none d-lg-block">
            <div class="d-flex align-items-center gap-2 py-3 border-top border-dark-subtle">
              <span class="avatar avatar-sm bg-primary-lt" id="meAvatar"></span>
              <div class="flex-fill lh-sm"><div class="fw-medium text-white" id="meName">…</div><div class="small text-secondary" id="meRole"></div></div>
              <button class="btn btn-icon btn-ghost-secondary" id="logout" title="Sign out" aria-label="Sign out"><i class="ti ti-logout"></i></button>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <div class="page-wrapper" id="view" aria-live="polite"></div>
  </div>
  <script src="lib/tabler/tabler.min.js"></script>
  <script src="lib/apexcharts/apexcharts.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
